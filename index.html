<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelime Ezber</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 100%; max-width: 350px; }
        .word { font-size: 28px; font-weight: bold; color: #1c1c1e; margin-bottom: 8px; word-wrap: break-word; }
        .meaning { font-size: 20px; color: #636366; margin-bottom: 20px; word-wrap: break-word; }
        .progress-bar-container { background: #e5e5ea; border-radius: 10px; height: 10px; width: 100%; margin-bottom: 10px; overflow: hidden; }
        .progress-bar { background: #34c759; height: 100%; width: 0%; transition: width 0.3s; }
        .progress-text { font-size: 13px; color: #8e8e93; font-weight: 600; margin-bottom: 20px; }
        
        button { background: #007aff; color: white; border: none; padding: 14px 20px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; margin-bottom: 10px; }
        button:active { background: #0056b3; }
        
        .file-upload-btn { background: #e5e5ea; color: #007aff; }
        input[type="file"] { display: none; }
        .status-msg { font-size: 12px; color: #34c759; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <div id="word" class="word">Kelime Yok</div>
        <div id="meaning" class="meaning">Lütfen dosya yükleyin</div>
        
        <div class="progress-bar-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>
        <div id="progressText" class="progress-text">0 / 40</div>

        <button onclick="nextWord()">Anladım / Sonraki</button>
        
        <!-- Dosya Yükleme Alanı -->
        <label for="fileInput" class="file-upload-btn" style="display: block; padding: 12px; border-radius: 12px; font-weight: 600; cursor: pointer; text-align: center;">
            📁 Liste Yükle (TXT / CSV)
        </label>
        <input type="file" id="fileInput" accept=".txt, .csv" onchange="handleFileUpload(event)">
        <div id="statusMsg" class="status-msg"></div>
    </div>

    <script>
        // Varsayılan Kelimeler
        let defaultWords = [
            {w: "Resilient", m: "Dayanıklı, esnek"},
            {w: "Ambiguous", m: "Belirsiz, muğlak"},
            {w: "Meticulous", m: "Titiz, özenli"},
            {w: "Die Sehnsucht", m: "Özlem, hasret"}
        ];

        // Kelime Listesini Al
        function getWordPool() {
            const stored = localStorage.getItem('customWordList');
            if (stored) {
                return JSON.parse(stored);
            }
            return defaultWords;
        }

        // Günlük İlerleme Bilgisi
        function getProgress() {
            const today = new Date().toISOString().split('T')[0];
            const data = JSON.parse(localStorage.getItem('dailyProgress') || '{}');
            if (data.date !== today) return { date: today, count: 0 };
            return data;
        }

        // Sonraki Kelimem
        function nextWord() {
            const pool = getWordPool();
            let p = getProgress();

            if (p.count >= 40) {
                document.getElementById('word').innerText = "Tebrikler! 🎉";
                document.getElementById('meaning').innerText = "Bugünkü 40 kelime hedefinizi tamamladınız.";
                updateProgressUI(40);
                return;
            }

            if (pool.length === 0) {
                document.getElementById('word').innerText = "Liste Boş";
                document.getElementById('meaning').innerText = "Lütfen TXT dosyası yükleyin.";
                return;
            }

            const randomItem = pool[Math.floor(Math.random() * pool.length)];
            document.getElementById('word').innerText = randomItem.w;
            document.getElementById('meaning').innerText = randomItem.m;

            p.count += 1;
            localStorage.setItem('dailyProgress', JSON.stringify(p));
            updateProgressUI(p.count);
        }

        function updateProgressUI(count) {
            document.getElementById('progressText').innerText = `${count} / 40`;
            document.getElementById('progressBar').style.width = `${(count / 40) * 100}%`;
        }

        // TXT / CSV Dosyasını İçe Aktarma
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                const lines = content.split('\n');
                let newWords = [];

                lines.forEach(line => {
                    // Virgül, tire veya iki nokta ile ayrılan kelimeleri yakala
                    let parts = line.split(/[,:\-]/);
                    if (parts.length >= 2) {
                        let word = parts[0].trim();
                        let meaning = parts[1].trim();
                        if (word && meaning) {
                            newWords.push({ w: word, m: meaning });
                        }
                    }
                });

                if (newWords.length > 0) {
                    localStorage.setItem('customWordList', JSON.stringify(newWords));
                    document.getElementById('statusMsg').innerText = `✅ ${newWords.length} kelime başarıyla yüklendi!`;
                    // İlerlemeyi sıfırla veya yeniden başlat
                    nextWord();
                } else {
                    alert("Dosya biçimi hatalı. Kelime ve anlamını virgül (,) veya tire (-) ile ayırın.");
                }
            };
            reader.readAsText(file);
        }

        // Başlangıçta çalıştır
        nextWord();
    </script>
</body>
</html>
